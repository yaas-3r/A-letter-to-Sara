<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first: fit the device, allow safe-area insets on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF9F4" />
  <meta name="description" content="A letter to Sara." />
  <title>A Letter To Sara</title>

  <!-- Fonts: elegant serif display + warm serif body + handwritten accent.
       They load from Google Fonts on GitHub Pages; there are serif fallbacks offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital@0;1&family=Parisienne&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

  <!-- Atmosphere: paper texture layer + petal/particle canvas (behind content) -->
  <div id="paper-layer" aria-hidden="true"></div>
  <canvas id="atmosphere" aria-hidden="true"></canvas>

  <!-- WELCOME SCREEN -->
  <div id="welcome">
    <div class="welcome-mark">for you</div>
    <h1 class="welcome-title">A Letter<br />To Sara</h1>
    <p class="welcome-sub">Take your time. There's no rush here. This is just my heart, one page at a time.</p>
    <button id="begin-btn" class="btn">Begin</button>
    <p class="welcome-note">Best with sound on. 🎧</p>
  </div>

  <!-- THE JOURNEY -->
  <main id="app">
    <div id="chapter-container"><!-- chapters are inserted here by app.js --></div>
  </main>

  <!-- Top controls -->
  <button id="audio-toggle" class="is-hidden" aria-label="Turn music on">♪</button>
  <button id="menu-btn" class="is-hidden" aria-label="Open chapter menu">☰</button>

  <!-- Chapter menu -->
  <div id="menu" aria-hidden="true">
    <h2>The Chapters</h2>
    <ul id="menu-list" class="menu-list"></ul>
    <button id="menu-close" class="btn btn-ghost">Close</button>
  </div>

  <!-- Bottom navigation -->
  <nav id="nav" class="is-hidden" aria-label="Chapter navigation">
    <button id="prev" class="nav-btn" aria-label="Previous chapter">‹</button>
    <div id="progress" aria-hidden="true"></div>
    <button id="next" class="nav-btn" aria-label="Next chapter">›</button>
  </nav>

  <!-- Scripts. Load order matters:
       content (data) → audio → atmosphere → chapters (uses content) → app (uses all) -->
  <script src="js/content.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/atmosphere.js"></script>
  <script src="js/chapters.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
